/* ---- حسابات الطلاب (للمعلم) ---- */
function acctCard(){return `<div class="card"><h3>🔑 حسابات الطلاب</h3><p class="note">رمز الفصل يطلبه الطالب عند أول تسجيل. إذا نسي الطالب كلمة المرور اضغط تصفير حسابه، وبعدها يسجّل من جديد.</p>
 <input id="ncode" placeholder="رمز فصل جديد (اختياري)" dir="ltr"><button class="btn" onclick="setCode()">تغيير رمز الفصل</button>
 ${CLAIMED.map(x=>`<div class="row"><span>${x.claimed?'✅':'○'} ${esc(x.name)}</span>${x.claimed?`<button class="tb" onclick="conf('rel${x.id}',()=>relStu(${x.id}))">تصفير</button>`:'<span class="note">لم يسجّل بعد</span>'}</div>`).join('')}</div>`}
async function setCode(){const c=V('ncode');if(c.length<3)return toast('الرمز 3 خانات على الأقل');const {error}=await sbc.rpc('set_class_code',{p_code:c});toast(error?'تعذر تغيير الرمز':'تم تغيير رمز الفصل')}
async function relStu(id){const {error}=await sbc.rpc('release_student',{p_id:id});if(error)return toast('تعذر التصفير');await loadClaimed();toast('تم تصفير الحساب');render()}

/* ---- شاشة الدخول ---- */
async function showLogin(msg){AUTHED=false;if(msg!==undefined)LG.msg=msg;$('#nav').style.display='none';$('#hb').style.display='none';
 try{const {data}=await sbc.rpc('public_roster');LG.names=data||[]}catch(e){LG.names=[]}renderLogin()}
function lgErr(m){LG.msg=m;LG.busy=0;renderLogin()}
function lgMode(m){LG.m=m;LG.msg='';renderLogin()}
function lgPick(v){LG.id=+v;LG.msg='';renderLogin()}
function renderLogin(){$('#nav').style.display='none';$('#bar').hidden=true;$('#cls').textContent='';const stu=LG.m=='s',sel=LG.names.find(x=>x.id==LG.id);
 const sf=`<select id="lgn" aria-label="اسمك" onchange="lgPick(this.value)"><option value="0">اختر اسمك</option>${LG.names.map(x=>`<option value="${x.id}" ${x.id==LG.id?'selected':''}>${esc(x.name)}${x.claimed?' ✓':''}</option>`).join('')}</select>`+
  (sel?(sel.claimed?`<input id="lpw" type="password" dir="ltr" placeholder="كلمة المرور" aria-label="كلمة المرور"><button class="btn" onclick="lgStu()">دخول</button><p class="note">نسيت كلمة المرور؟ كلّم معلمك ليصفّر حسابك.</p>`
  :`<p class="note">أول مرة؟ اختر كلمة مرور تتذكرها (6 خانات على الأقل) واكتب رمز الفصل.</p><input id="lpw" type="password" dir="ltr" placeholder="كلمة مرور جديدة" aria-label="كلمة المرور"><input id="lpw2" type="password" dir="ltr" placeholder="أعد كتابة كلمة المرور" aria-label="تأكيد كلمة المرور"><input id="lcd" inputmode="numeric" dir="ltr" placeholder="رمز الفصل" aria-label="رمز الفصل"><button class="btn" onclick="lgStu()">إنشاء حسابي</button>`):'');
 const tf=`<input id="lem" type="email" dir="ltr" placeholder="الإيميل" aria-label="الإيميل"><input id="lpw" type="password" dir="ltr" placeholder="كلمة المرور" aria-label="كلمة المرور"><button class="btn" onclick="lgTch(false)">دخول</button> <button class="tb" onclick="lgTch(true)">أول مرة؟ إنشاء حساب المعلم</button>`;
 $('#app').innerHTML=`<div class="card"><h3>👋 أهلًا بك في فصل ${esc(CLS.c)}</h3><div class="seg" style="margin:6px 0"><button class="${stu?'on':''}" onclick="lgMode('s')">طالب</button><button class="${stu?'':'on'}" onclick="lgMode('t')">معلم</button></div>${LG.msg?`<div class="rp bad">${esc(LG.msg)}</div>`:''}${stu?sf:tf}</div>`}
async function startSession(){const {data}=await sbc.auth.getSession();usr=data.session.user;await afterLogin()}
async function lgStu(){if(LG.busy)return;const sel=LG.names.find(x=>x.id==LG.id);if(!sel)return lgErr('اختر اسمك أولًا');const pw=V('lpw');if(pw.length<6)return lgErr('كلمة المرور 6 خانات على الأقل');LG.busy=1;
 try{if(sel.claimed){const {error}=await sbc.auth.signInWithPassword({email:emailOf(sel.id),password:pw});if(error)return lgErr('كلمة المرور غير صحيحة')}
  else{if(pw!==V('lpw2'))return lgErr('كلمتا المرور غير متطابقتين');const code=V('lcd');if(!code)return lgErr('اكتب رمز الفصل');
   const r=await sbc.auth.signUp({email:emailOf(sel.id),password:pw});
   if(r.error){if(/registered|exists/i.test(r.error.message||'')){const s2=await sbc.auth.signInWithPassword({email:emailOf(sel.id),password:pw});if(s2.error)return lgErr('هذا الاسم له حساب سابق بكلمة مرور مختلفة، كلّم معلمك')}else return lgErr('تعذر إنشاء الحساب: '+(r.error.message||''))}
   else if(!r.data||!r.data.session)return lgErr('تأكيد الإيميل ما زال مفعّلًا في Supabase، نبّه المعلم');
   const c=await sbc.rpc('claim_student',{p_id:sel.id,p_code:code});
   if(c.error){const m=c.error.message||'';await sbc.auth.signOut();return lgErr(/bad_code/.test(m)?'رمز الفصل غير صحيح':/name_taken/.test(m)?'هذا الاسم محجوز، كلّم معلمك':/already_claimed/.test(m)?'حسابك مرتبط باسم آخر':'تعذر ربط الحساب: '+m)}}
  await startSession()}catch(e){lgErr('تعذر الاتصال، حاول مرة ثانية')}finally{LG.busy=0}}
async function lgTch(create){if(LG.busy)return;const em=V('lem').toLowerCase(),pw=V('lpw');if(!em||pw.length<6)return lgErr('اكتب الإيميل وكلمة مرور 6 خانات على الأقل');LG.busy=1;
 try{if(create){let r=await sbc.auth.signUp({email:em,password:pw});
   if(r.error){if(/registered|exists/i.test(r.error.message||'')){r=await sbc.auth.signInWithPassword({email:em,password:pw});if(r.error)return lgErr('الحساب موجود وكلمة المرور مختلفة')}else return lgErr('تعذر إنشاء الحساب: '+(r.error.message||''))}
   else if(!r.data||!r.data.session)return lgErr('تأكيد الإيميل ما زال مفعّلًا في Supabase');
   const c=await sbc.rpc('claim_teacher');if(c.error&&!/teacher_exists/.test(c.error.message||'')){await sbc.auth.signOut();return lgErr(/wrong_email/.test(c.error.message||'')?'هذا الإيميل غير مصرّح له بحساب المعلم':'تعذر إنشاء حساب المعلم')}}
  else{const {error}=await sbc.auth.signInWithPassword({email:em,password:pw});if(error)return lgErr('الإيميل أو كلمة المرور غير صحيحة')}
  await startSession()}catch(e){lgErr('تعذر الاتصال، حاول مرة ثانية')}finally{LG.busy=0}}

/* ---- بعد الدخول ---- */
async function afterLogin(){
 const {data,error}=await sbc.rpc('get_main');
 if(error){const m=String(error.message||'');await sbc.auth.signOut();return showLogin(/not_claimed/.test(m)?(LG.m=='t'?'هذا الحساب ليس حساب المعلم.':'حسابك غير مربوط باسم طالب. سجّل من جديد برمز الفصل.'):'تعذر الدخول: '+m)}
 role=data.role;
 if(role=='t'){if(data.v){loadSnap(data.v)}else{await initBlank()}ensureDays();await loadClaimed();AUTHED=true;LASTJ=data.v?JSON.stringify(snapshot()):'';await ingest();await saveNow()}
 else{if(!data.v){AUTHED=false;$('#app').innerHTML='<div class="card"><h3>⏳ الفصل لم يُجهّز بعد</h3><p>معلمك ما فتح الموقع لأول مرة. جرّب بعد قليل.</p><button class="btn" onclick="logout()">خروج</button></div>';return}
  loadStu(data);const {data:rows}=await sbc.from('inbox').select('*').eq('done',false).order('created_at');(rows||[]).forEach(applyRow);ensureDays();AUTHED=true}
 tab='home';$('#nav').style.display='';$('#hb').style.display='';startTimer();render();scrollTo(0,0)}
async function boot(){
 const dn=document.getElementById('demonote');if(dn)dn.hidden=true;
 if(!window.supabase){$('#app').innerHTML='<div class="card"><h3>تعذر تحميل الموقع</h3><p>تأكد من الإنترنت وأعد فتح الصفحة.</p></div>';return}
 sbc=window.supabase.createClient(SB_URL,SB_KEY);
 let ss=null;try{ss=(await sbc.auth.getSession()).data.session}catch(e){}
 if(ss){usr=ss.user;try{await afterLogin()}catch(e){showLogin('تعذر الدخول، حاول مرة ثانية')}}else showLogin()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AUTHED&&!typing()&&!BUSY){if(role=='t')ingest().then(n=>{if(n){toast(`وصلك ${n} من الطلاب`);render()}});else loadStudent().then(render).catch(()=>{})}});
const _render=render;render=function(){if(AUTHED)ensureDays();_render();if(AUTHED){hydrate();if(role=='t')queueSave()}};
boot();

</script>
</body>
</html>
